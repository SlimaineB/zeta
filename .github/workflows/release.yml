name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [portal, cpp, go, python-uv, git-server]
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: matrix.image == 'portal'
        with:
          go-version-file: portal/go.mod
          cache-dependency-path: |
            portal/go.sum
            cli/go.sum
      - name: Build portal binaries
        if: matrix.image == 'portal'
        run: make -C portal build syncd
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image == 'portal' && 'portal' || 'platform' }}
          file: ${{ matrix.image == 'portal' && 'portal/Dockerfile' || format('platform/images/{0}/Dockerfile', matrix.image) }}
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/zeta/${{ matrix.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.registry }}/zeta/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/zeta-${GOOS}-${GOARCH}${ext}" ./cmd/zeta
      - uses: actions/upload-artifact@v4
        with:
          name: zeta-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cli/dist/zeta-*
          if-no-files-found: error

  helm:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Package chart
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          if ! command -v yq >/dev/null 2>&1; then
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          export REGISTRY
          yq -i '.image.registry = strenv(REGISTRY)' charts/zeta/values.yaml
          mkdir -p dist
          helm package charts/zeta --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: Push chart
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/zeta-*.tgz "oci://${REGISTRY}/charts"
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error

  release:
    needs: [cli, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
      - name: Make GHCR packages public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in zeta/portal zeta/cpp zeta/go zeta/python-uv zeta/git-server charts/zeta; do
            encoded=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$pkg")
            curl -fsS -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/container/${encoded}" \
              -d '{"visibility":"public"}' \
              || echo "warning: could not make ${pkg} public"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          files: dist/*
          generate_release_notes: true
