<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeta — Sign in</title>
  <script>
    (function () {
      var saved = localStorage.getItem("zeta-theme");
      var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span> Zeta</div>
    <button id="theme-toggle" class="icon-button" type="button" title="Change theme" aria-label="Change theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </header>

  <main class="login-wrap">
    <section class="login-card">
      <h1>Sign in</h1>
      <p class="muted">Sign in to follow builds. Builds are started from your repository with the CLI.</p>
      <form id="dev-login">
        <label>Email
          <input id="username" name="username" type="email" value="dev@example.com" required>
        </label>
        <label>Password
          <input id="password" name="password" type="password" value="dev" required>
        </label>
        <button type="submit">Sign in</button>
        <p id="error" class="error" hidden></p>
      </form>
      <p class="muted small">Local dev mode. In production, this page redirects to your OIDC provider.</p>
    </section>
  </main>

  <script>
    document.getElementById("theme-toggle").addEventListener("click", function () {
      var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("zeta-theme", next);
    });

    document.getElementById("dev-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const error = document.getElementById("error");
      error.hidden = true;
      const res = await fetch("/api/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });
      if (res.ok) {
        location.href = "/";
      } else {
        error.textContent = await res.text();
        error.hidden = false;
      }
    });
  </script>
</body>
</html>
