{{- if and .Values.profiles.inline (not .Values.profiles.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zeta.fullname" . }}-profiles
  labels:
    {{- include "zeta.labels" . | nindent 4 }}
data:
  profiles.yaml: |
    {{- .Values.profiles.inline | nindent 4 }}
{{- end }}
