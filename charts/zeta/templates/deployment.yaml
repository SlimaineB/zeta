apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zeta.fullname" . }}
  labels:
    {{- include "zeta.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.portal.replicaCount }}
  selector:
    matchLabels:
      {{- include "zeta.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zeta.selectorLabels" . | nindent 8 }}
      {{- with .Values.portal.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "zeta.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.portal.podSecurityContext | nindent 8 }}
      containers:
        - name: portal
          image: {{ include "zeta.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -addr={{ .Values.portal.addr }}
            - -namespace={{ .Release.Namespace }}
            - -storage-class={{ .Values.portal.storageClass }}
            - -volume-quota={{ .Values.portal.volumeQuota }}
            - -volume-max={{ .Values.portal.volumeMax }}
            - -env-idle-timeout={{ .Values.portal.envIdleTimeout }}
            {{- if .Values.image.registry }}
            - -image-registry={{ .Values.image.registry }}
            {{- end }}
            - -image-tag={{ include "zeta.imageTag" . }}
            - -ide-image={{ if .Values.ide.enabled }}{{ .Values.ide.image.repository }}:{{ .Values.ide.image.tag }}{{ end }}
            {{- if .Values.auth.dev }}
            - -oidc-dev
            {{- else }}
            - -oidc-issuer={{ required "auth.oidc.issuer is required when auth.dev is false" .Values.auth.oidc.issuer }}
            {{- if .Values.auth.oidc.discoveryURL }}
            - -oidc-discovery-url={{ .Values.auth.oidc.discoveryURL }}
            {{- end }}
            {{- if .Values.auth.oidc.authorizationURL }}
            - -oidc-authorization-url={{ .Values.auth.oidc.authorizationURL }}
            {{- end }}
            - -oidc-client-id={{ .Values.auth.oidc.clientID }}
            {{- if .Values.auth.oidc.redirectURL }}
            - -oidc-redirect-url={{ .Values.auth.oidc.redirectURL }}
            {{- end }}
            - -oidc-scopes={{ .Values.auth.oidc.scopes }}
            {{- if .Values.auth.oidc.allowedGroups }}
            - -oidc-allowed-groups={{ .Values.auth.oidc.allowedGroups }}
            {{- end }}
            {{- if .Values.auth.oidc.allowedUsers }}
            - -oidc-allowed-users={{ .Values.auth.oidc.allowedUsers }}
            {{- end }}
            - -oidc-username-claim={{ .Values.auth.oidc.usernameClaim }}
            - -oidc-email-claim={{ .Values.auth.oidc.emailClaim }}
            - -oidc-groups-claim={{ .Values.auth.oidc.groupsClaim }}
            {{- end }}
            - -oidc-session-ttl={{ .Values.auth.sessionTTL }}
            {{- if .Values.auth.secureCookie }}
            - -secure-cookie
            {{- end }}
            {{- if or .Values.profiles.existingConfigMap .Values.profiles.inline }}
            - -profiles-file=/etc/zeta/profiles.yaml
            {{- end }}
            {{- range .Values.portal.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ZETA_OIDC_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zeta.authSecretName" . }}
                  key: session-key
            {{- if not .Values.auth.dev }}
            - name: ZETA_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zeta.authSecretName" . }}
                  key: oidc-client-secret
                  optional: true
            {{- end }}
            {{- with .Values.portal.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: contexts
              mountPath: /contexts
            {{- if or .Values.profiles.existingConfigMap .Values.profiles.inline }}
            - name: profiles
              mountPath: /etc/zeta
              readOnly: true
            {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.portal.podSecurityContext | nindent 8 }}
      containers:
        - name: portal
          image: {{ include "zeta.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -addr={{ .Values.portal.addr }}
            - -namespace={{ .Release.Namespace }}
            - -storage-class={{ .Values.portal.storageClass }}
            - -volume-quota={{ .Values.portal.volumeQuota }}
            - -volume-max={{ .Values.portal.volumeMax }}
            - -env-idle-timeout={{ .Values.portal.envIdleTimeout }}
            {{- if .Values.image.registry }}
            - -image-registry={{ .Values.image.registry }}
            {{- end }}
            - -image-tag={{ include "zeta.imageTag" . }}
            - -ide-image={{ if .Values.ide.enabled }}{{ .Values.ide.image.repository }}:{{ .Values.ide.image.tag }}{{ end }}
            {{- if .Values.auth.dev }}
            - -oidc-dev
            {{- else }}
            - -oidc-issuer={{ required "auth.oidc.issuer is required when auth.dev is false" .Values.auth.oidc.issuer }}
            {{- if .Values.auth.oidc.discoveryURL }}
            - -oidc-discovery-url={{ .Values.auth.oidc.discoveryURL }}
            {{- end }}
            {{- if .Values.auth.oidc.authorizationURL }}
            - -oidc-authorization-url={{ .Values.auth.oidc.authorizationURL }}
            {{- end }}
            - -oidc-client-id={{ .Values.auth.oidc.clientID }}
            {{- if .Values.auth.oidc.redirectURL }}
            - -oidc-redirect-url={{ .Values.auth.oidc.redirectURL }}
            {{- end }}
            - -oidc-scopes={{ .Values.auth.oidc.scopes }}
            {{- if .Values.auth.oidc.allowedGroups }}
            - -oidc-allowed-groups={{ .Values.auth.oidc.allowedGroups }}
            {{- end }}
            {{- if .Values.auth.oidc.allowedUsers }}
            - -oidc-allowed-users={{ .Values.auth.oidc.allowedUsers }}
            {{- end }}
            - -oidc-username-claim={{ .Values.auth.oidc.usernameClaim }}
            - -oidc-email-claim={{ .Values.auth.oidc.emailClaim }}
            - -oidc-groups-claim={{ .Values.auth.oidc.groupsClaim }}
            {{- end }}
            - -oidc-session-ttl={{ .Values.auth.sessionTTL }}
            {{- if .Values.auth.secureCookie }}
            - -secure-cookie
            {{- end }}
            {{- if or .Values.profiles.existingConfigMap .Values.profiles.inline }}
            - -profiles-file=/etc/zeta/profiles.yaml
            {{- end }}
            {{- range .Values.portal.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ZETA_OIDC_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zeta.authSecretName" . }}
                  key: session-key
            {{- if not .Values.auth.dev }}
            - name: ZETA_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zeta.authSecretName" . }}
                  key: oidc-client-secret
                  optional: true
            {{- end }}
            {{- with .Values.portal.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: contexts
              mountPath: /contexts
            {{- if or .Values.profiles.existingConfigMap .Values.profiles.inline }}
            - name: profiles
              mountPath: /etc/zeta
              readOnly: true
            {{- end }}
          securityContext:
            {{- toYaml .Values.portal.securityContext | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.portal.resources | nindent 12 }}
      volumes:
        - name: contexts
          persistentVolumeClaim:
            claimName: zeta-poc-contexts
        {{- if or .Values.profiles.existingConfigMap .Values.profiles.inline }}
        - name: profiles
          configMap:
            name: {{ .Values.profiles.existingConfigMap | default (printf "%s-profiles" (include "zeta.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
