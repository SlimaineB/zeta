{{- if not .Values.auth.existingSecret }}
{{- $secretName := include "zeta.authSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $sessionKey := .Values.auth.sessionKey -}}
{{- if not $sessionKey -}}
{{- if $existing -}}
{{- $sessionKey = index $existing.data "session-key" | default "" | b64dec -}}
{{- end -}}
{{- if not $sessionKey -}}
{{- $sessionKey = randAlphaNum 48 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "zeta.labels" . | nindent 4 }}
type: Opaque
data:
  session-key: {{ $sessionKey | b64enc | quote }}
  oidc-client-secret: {{ .Values.auth.oidc.clientSecret | b64enc | quote }}
{{- end }}
