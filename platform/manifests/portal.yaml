apiVersion: v1
kind: ServiceAccount
metadata:
  name: zeta-portal
  namespace: zeta-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zeta-portal
  namespace: zeta-poc
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zeta-portal-storage
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zeta-portal-storage
subjects:
  - kind: ServiceAccount
    name: zeta-portal
    namespace: zeta-poc
roleRef:
  kind: ClusterRole
  name: zeta-portal-storage
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zeta-portal
  namespace: zeta-poc
subjects:
  - kind: ServiceAccount
    name: zeta-portal
    namespace: zeta-poc
roleRef:
  kind: Role
  name: zeta-portal
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeta-portal
  namespace: zeta-poc
  labels:
    app.kubernetes.io/name: zeta-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zeta-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeta-portal
    spec:
      serviceAccountName: zeta-portal
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: zeta/portal:0.1
          imagePullPolicy: IfNotPresent
          args:
            - -addr=:8080
            - -namespace=zeta-poc
            - -oidc-dev
            - -oidc-session-key=dev-session-key-change-in-production
            - -env-idle-timeout=15m
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: contexts
              mountPath: /contexts
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: contexts
          persistentVolumeClaim:
            claimName: zeta-poc-contexts
---
apiVersion: v1
kind: Service
metadata:
  name: zeta-portal
  namespace: zeta-poc
spec:
  selector:
    app.kubernetes.io/name: zeta-portal
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeta-portal
  namespace: zeta-poc
spec:
  ingressClassName: traefik
  rules:
    - host: zeta.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zeta-portal
                port:
                  name: http
