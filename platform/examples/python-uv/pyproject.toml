[project]
name = "hello-uv"
version = "0.1.0"
description = "Zeta uv POC"
requires-python = ">=3.12"
dependencies = ["httpx"]

[dependency-groups]
dev = ["hatchling"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_uv"]
